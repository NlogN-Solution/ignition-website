name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nlogn-solution/ignition-website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write .env.production (build-time public config)
        run: |
          {
            echo "NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}"
            echo "NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}"
            echo "NEXT_PUBLIC_PORTAL_URL=${{ vars.NEXT_PUBLIC_PORTAL_URL }}"
            echo "NEXT_PUBLIC_CONTACT_PHONE=${{ vars.NEXT_PUBLIC_CONTACT_PHONE }}"
            echo "NEXT_PUBLIC_CONTACT_WHATSAPP=${{ vars.NEXT_PUBLIC_CONTACT_WHATSAPP }}"
            echo "NEXT_PUBLIC_CONTACT_HOURS=${{ vars.NEXT_PUBLIC_CONTACT_HOURS }}"
            if [ -n "${{ vars.NEXT_PUBLIC_LEAD_ENDPOINT }}" ]; then
              echo "NEXT_PUBLIC_LEAD_ENDPOINT=${{ vars.NEXT_PUBLIC_LEAD_ENDPOINT }}"
            fi
          } > .env.production
          cat .env.production

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy
        run: ssh deploy@${{ secrets.VPS_HOST }} landing
